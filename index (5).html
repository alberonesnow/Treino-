<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8590c">
<title>Meu Treino</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#14181f;--mu:#667085;--ac:#e8590c;--ok:#2f9e44;--bd:#e3e6eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--cd:#1a1f27;--tx:#eef1f5;--mu:#98a2b3;--bd:#2a313c}}
:root[data-theme="dark"]{--bg:#0f1217;--cd:#1a1f27;--tx:#eef1f5;--mu:#98a2b3;--bd:#2a313c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:96px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{padding:16px 16px 8px}
h1{font-size:20px;margin:0}
.sub{color:var(--mu);font-size:14px}
nav{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
nav button.td{font-weight:700}
main{padding:0 16px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.cd.done{border-color:var(--ok)}
.t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.t span{color:var(--mu);font-weight:400;font-size:14px;white-space:nowrap}
.sets{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.sets button{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:transparent;color:var(--tx);font-size:16px}
.sets button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sets input{width:84px;height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);padding:0 10px;font-size:16px;margin-left:auto}
details{font-size:14px;color:var(--mu)}
summary{cursor:pointer;padding:4px 0}
a{color:var(--ac)}
.hd{padding:10px 0;border-bottom:1px solid var(--bd)}
.hd b{display:block}
.msg{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
#tm{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd);display:none;align-items:center;gap:10px}
#tm b{font-size:26px;font-variant-numeric:tabular-nums;color:var(--ac)}
#tm button{margin-left:auto;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 12px}
.rs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mu);margin-bottom:10px}
.rs button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:6px 10px}
.rs button.on{border-color:var(--ac);color:var(--ac)}
.vd{margin:8px 0;aspect-ratio:16/9;width:100%;border:0;border-radius:10px}
</style></head><body>
<header><h1>Meu Treino</h1><div class="sub" id="sub"></div></header>
<nav id="nav"></nav><main id="app"></main>
<div id="tm"><span>Descanso</span><b id="tt">0:00</b><button onclick="stopT()">Pular</button></div>
<script>
const DN=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const D={
1:[
  "Peito, ombros e tríceps",
  [
    ["Supino reto com barra", 3, "10–12", "Escápulas juntas e firmes no banco; desça a barra até a linha do peito, cotovelos a cerca de 45° do tronco.", "50RSzhMG5Hc"],
    ["Supino inclinado com halteres", 3, "10–12", "Banco a 30–45°; desça controlando até alinhar os cotovelos ao tronco e suba sem bater os halteres.", "Fa-X2ByLHaY"],
    ["Desenvolvimento com halteres", 3, "10–12", "Abdômen firme, sem arquear a lombar; empurre acima da cabeça e desça até a altura das orelhas.", "Wywt3mN-6RA"],
    ["Elevação lateral", 2, "12–15", "Cotovelos levemente flexionados; suba até a altura dos ombros sem balançar o tronco.", "nhQ4mdk0TmM"],
    ["Tríceps corda", 3, "12", "Cotovelos colados ao corpo; estenda até o fim e abra a corda no final.", "VnFopAIGO7E"]
  ]
],
2:[
  "Costas e bíceps",
  [
    ["Puxada frontal", 3, "10–12", "Peito aberto; puxe a barra até a altura do queixo/peito levando os cotovelos para baixo.", "oF-RqXrkZHU"],
    ["Remada baixa", 3, "10–12", "Coluna neutra; puxe o cabo em direção ao abdômen juntando as escápulas, sem jogar o tronco.", "Ai8CjE7szJU"],
    ["Remada unilateral com halter", 2, "10 cada lado", "Apoie mão e joelho no banco; leve o halter ao quadril, cotovelo rente ao corpo.", "RmowAgP6vsk"],
    ["Crucifixo inverso na máquina", 2, "12–15", "Peito apoiado; abra os braços até a linha dos ombros, sem encolhê-los.", "XnsTCSIZWU8"],
    ["Rosca direta", 3, "10–12", "Cotovelos fixos ao lado do corpo; suba sem balançar e desça devagar.", "KX1mEovB8C8"],
    ["Rosca martelo", 2, "12", "Pegada neutra (polegares para cima); cotovelos parados e movimento controlado.", "GilFwBs_kOs"]
  ]
],
3:[
  "Quadríceps e panturrilhas",
  [
    ["Agachamento livre", 3, "10–12", "Pés na largura dos ombros, pés bem apoiados; joelhos acompanham a direção dos pés; desça até onde a mobilidade permitir.", "3vTRFnzCMaA"],
    ["Leg press 45°", 3, "10–12", "Lombar apoiada no encosto; não trave os joelhos no topo e desça de forma controlada.", "DQ4-HXFlKXI"],
    ["Cadeira extensora", 3, "12–15", "Estenda os joelhos até quase o fim, segure um instante e volte devagar.", "tcdgal1epsI"],
    ["Mesa flexora", 2, "12", "Quadril colado ao banco; flexione levando os calcanhares em direção ao glúteo.", "ne-J--fK0tE"],
    ["Panturrilha em pé", 3, "12–15", "Amplitude completa: desça o calcanhar bem e suba na ponta dos pés, com pausa no topo.", "12_-N79aAeA"]
  ]
],
4:[
  "Peito, costas e braços",
  [
    ["Supino máquina", 3, "10–12", "Ajuste o banco para as pegadas ficarem na altura do peito; empurre sem tirar as costas do encosto.", "bKSvckCwvh4"],
    ["Puxada neutra", 3, "10–12", "Pegada neutra; leve os cotovelos para baixo e para trás, sem balançar o tronco.", "MzjQ92Lv9Xk"],
    ["Crossover", 2, "12–15", "Leve inclinação do tronco; una as mãos à frente do peito com cotovelos levemente flexionados.", "GpqByT9btdU"],
    ["Remada articulada", 2, "10–12", "Peito apoiado; puxe até as escápulas se aproximarem e retorne com controle.", "Sq7rWvJtzDY"],
    ["Rosca alternada", 2, "12", "Um braço por vez, sem balançar; gire o punho para cima durante a subida.", "a28SbBN_14k"],
    ["Tríceps na polia", 2, "12", "Cotovelos fixos; estenda por completo e volte devagar.", "CVrp2m_rBfs"]
  ]
],
5:[
  "Posterior, glúteos e abdômen",
  [
    ["Stiff com halteres", 3, "10–12", "Joelhos levemente flexionados; leve o quadril para trás com a coluna reta e desça até sentir o posterior da coxa.", "BU_87JJzNA4"],
    ["Mesa flexora", 3, "10–12", "Quadril colado ao banco; suba e desça sem usar impulso.", "ne-J--fK0tE"],
    ["Elevação pélvica", 3, "10–12", "Queixo próximo ao peito; suba o quadril contraindo o glúteo, sem arquear a lombar.", "6sTO9ejM-Ew"],
    ["Cadeira abdutora", 2, "12–15", "Tronco apoiado; abra as pernas de forma controlada e volte devagar.", "GljAOyT5xLI"],
    ["Panturrilha sentada", 3, "12–15", "Amplitude completa, com pausa em cima e controle na descida.", "6eJ9EVwazXk"],
    ["Prancha abdominal", 3, "20–30 s", "Corpo alinhado da cabeça aos calcanhares, abdômen e glúteos contraídos, sem deixar o quadril cair.", "ffHr8a6DRvU"]
  ]
]
};

const OPEN={};let S={};try{S=JSON.parse(localStorage.getItem("tr")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("tr",JSON.stringify(S))}catch(e){}};
const now=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let dow=new Date().getDay(),cur=now();
let tab=(dow>=1&&dow<=5)?dow:1,rest=90;
try{rest=+localStorage.getItem("rs")||90}catch(e){}
const rec=(id)=>{const t=now();S[t]=S[t]||{};return S[t][id]=S[t][id]||{s:[],l:""}};
function upd(id,n){
  const r=rec(id),c=document.getElementById("c-"+id);if(!c)return;
  c.querySelectorAll(".sets button").forEach((b,k)=>{b.className=r.s[k]?"on":"";b.textContent=r.s[k]?"✓":k+1});
  c.classList.toggle("done",r.s.slice(0,n).filter(Boolean).length===n);
  let tot=0,dn=0;D[tab][1].forEach(([,s],i)=>{tot+=s;dn+=rec(tab+"-"+i).s.slice(0,s).filter(Boolean).length});
  const bar=document.querySelector(".bar i");if(bar)bar.style.width=(tot?dn/tot*100:0)+"%";
}
function toggle(id,k,n){const r=rec(id);r.s=Array.from({length:n},(_,i)=>!!r.s[i]);r.s[k]=!r.s[k];save();if(r.s[k])startT();upd(id,n)}
function setL(id,v){rec(id).l=v;save()}
let iv=null,end=0;
function startT(){end=Date.now()+rest*1e3;document.getElementById("tm").style.display="flex";clearInterval(iv);tick();iv=setInterval(tick,250)}
function tick(){const s=Math.max(0,Math.ceil((end-Date.now())/1e3));document.getElementById("tt").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(!s){try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}stopT()}}
function stopT(){clearInterval(iv);document.getElementById("tm").style.display="none"}
function setRest(v){rest=v;try{localStorage.setItem("rs",v)}catch(e){}document.querySelectorAll(".rs button").forEach(b=>b.classList.toggle("on",b.textContent===v+"s"))}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){
document.getElementById("sub").textContent=DN[dow]+", "+now().split("-").reverse().join("/");
document.getElementById("nav").innerHTML=[1,2,3,4,5].map(d=>`<button class="${tab===d?"on":""} ${d===dow?"td":""}" onclick="go(${d})">${DN[d]}</button>`).join("")+`<button class="${tab==="h"?"on":""}" onclick="go('h')">Histórico</button>`;
const a=document.getElementById("app");
if(tab==="h"){
const ds=Object.keys(S).sort().reverse().filter(d=>Object.values(S[d]).some(r=>r.s.some(Boolean)));
a.innerHTML=ds.length?ds.map(d=>{let n=0,ls=[],dd=null;for(const id in S[d]){const r=S[d][id],c=r.s.filter(Boolean).length;if(!c)continue;n+=c;const [x,i]=id.split("-");dd=x;ls.push(D[x][1][i][0]+": "+c+" série(s)"+(r.l?" · "+r.l+" kg":""))}
return `<div class="hd"><b>${d.split("-").reverse().join("/")} · ${D[dd][0]} · ${n} séries</b><span class="sub">${ls.join("<br>")}</span></div>`}).join(""):`<div class="msg">Nenhum treino registrado ainda. Marque as séries na aba do dia.</div>`;return}
const [nome,ex]=D[tab];let tot=0,dn=0;
const cards=ex.map(([n,s,r,c,yid],i)=>{const id=tab+"-"+i,rc=rec(id),f=rc.s.slice(0,s).filter(Boolean).length;tot+=s;dn+=f;
return `<div class="cd ${f===s?"done":""}" id="c-${id}"><div class="t">${n}<span>${s} × ${r}</span></div>
<div class="sets">${Array.from({length:s},(_,k)=>`<button class="${rc.s[k]?"on":""}" onclick="toggle('${id}',${k},${s})">${rc.s[k]?"✓":k+1}</button>`).join("")}<input type="number" inputmode="decimal" placeholder="kg" value="${rc.l}" onchange="setL('${id}',this.value)"></div>
<details ${OPEN[id]?"open":""} ontoggle="OPEN['${id}']=this.open"><summary>Como executar</summary><p>${c}</p>${yid?`<iframe class="vd" loading="lazy" allowfullscreen title="${n}" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/${yid}"></iframe>`:""}<a href="https://www.youtube.com/results?search_query=${encodeURIComponent("como fazer "+n)}" target="_blank" rel="noopener">Ver mais vídeos no YouTube</a></details></div>`}).join("");
a.innerHTML=(tab!==dow&&dow>=1&&dow<=5?`<div class="msg">Você está vendo o treino de ${DN[tab]}. Hoje é ${DN[dow]}.</div>`:"")+(dow===0||dow===6?`<div class="msg">Hoje é dia de recuperação. Descanse e durma bem.</div>`:"")+`<h2 style="font-size:18px;margin:8px 0 0">${nome}</h2><div class="bar"><i style="width:${tot?dn/tot*100:0}%"></i></div><div class="rs">Descanso: ${[60,90,120].map(v=>`<button class="${rest===v?"on":""}" onclick="setRest(${v})">${v}s</button>`).join("")}</div>`+cards}
function chk(){const n=now();if(n!==cur){cur=n;dow=new Date().getDay();tab=(dow>=1&&dow<=5)?dow:1;render()}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()});
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
